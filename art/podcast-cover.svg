<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="3000" viewBox="0 0 3000 3000">
  <!-- Podcast artwork: the penny mark over the name, on the book-paper background. -->
  <rect width="3000" height="3000" fill="#fbf8f2"/>
  <g transform="translate(900 520) scale(30)">
    <circle cx="20" cy="20" r="18" fill="#b4532a"/>
    <circle cx="20" cy="20" r="14.2" fill="none" stroke="#fbf8f2" stroke-opacity=".5" stroke-width="1.2"/>
    <text x="20" y="27" text-anchor="middle" font-family="Liberation Serif, Georgia, serif" font-size="19" font-weight="700" font-style="italic" fill="#fbf8f2">p</text>
  </g>
  <g font-family="Liberation Serif, Georgia, serif" fill="#22201c" text-anchor="middle" font-weight="600" letter-spacing="38">
    <text x="1519" y="2120" font-size="190">PENNY FOR</text>
    <text x="1519" y="2390" font-size="190">MY THOUGHTS</text>
  </g>
</svg>
